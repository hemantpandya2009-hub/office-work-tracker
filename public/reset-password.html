<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Office Work Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .reset-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .reset-card h2 { margin-top: 0; color: #1e293b; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #334155; font-weight: bold; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background-color: #f59e0b; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        .btn-submit:hover { background-color: #d97706; }
        .back-link { display: block; margin-top: 15px; color: #3b82f6; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="reset-card">
        <h2>Reset Password</h2>
        <p style="color: #64748b; margin-bottom: 25px;">Enter your username and new password.</p>
        
        <form action="/reset-password" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" class="form-control" name="username" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" class="form-control" name="new_password" required>
            </div>
            <div class="form-group">
                <label>Master Recovery Key <small style="font-weight:normal; color:#64748b;">(Required only for Admin HP)</small></label>
                <input type="password" class="form-control" name="admin_key" placeholder="Enter recovery key if resetting admin">
            </div>
            <button type="submit" class="btn-submit">Update Password</button>
        </form>
        <a href="/login.html" class="back-link">Back to Login</a>
    </div>
</body>
</html>
