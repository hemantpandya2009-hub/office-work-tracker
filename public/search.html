<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Office Work Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f6f9; }
        .header { background-color: #1e293b; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;}
        .header h2 { margin: 0; }
        .container { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 220px; background-color: #334155; color: white; padding-top: 20px; }
        .sidebar a { display: block; color: #cbd5e1; text-decoration: none; padding: 15px 25px; border-left: 4px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background-color: #475569; color: white; border-left: 4px solid #3b82f6; }
        .main-content { padding: 30px; flex-grow: 1; overflow-y: auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box input { flex-grow: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 16px; }
        .search-box button { background-color: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .search-box button:hover { background-color: #2563eb; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #cbd5e1; }
        th { background-color: #f8fafc; color: #334155; font-weight: bold; }
        tr:hover { background-color: #f1f5f9; }
        .badge { padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .priority-high { background-color: #fef08a; color: #854d0e; }
        .priority-urgent { background-color: #fecaca; color: #991b1b; }
        .priority-normal { background-color: #d1fae5; color: #065f46; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Office Work Tracker</h2>
        <span>Status: Online</span>
    </div>
    <div class="container">
        <div class="sidebar">
            <a href="/">Dashboard</a>
            <a href="/add-work.html">Add Work</a>
            <a href="/my-work.html">My Work</a>
            <a href="/pending.html">Pending</a>
            <a href="/reports.html">Reports</a>
            <a href="/search.html" class="active">Search</a>
            <a href="/manage-users.html">Manage Users</a>
            <a href="/logout" style="color: #ef4444; font-weight: bold; margin-top: 20px; border-top: 1px solid #cbd5e1; padding-top: 15px; display: block; text-decoration: none;">🚪 Logout</a>
        </div>
        <div class="main-content">
            <h1>Search Records</h1>
            <div class="card">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by Work ID, File No, or Subject...">
                    <button onclick="performSearch()">Search</button>
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th>Work ID</th>
                            <th>Agency</th>
                            <th>File No.</th>
                            <th>Subject</th>
                            <th>Due Date</th>
                            <th>Priority</th>
                            <th>Comments</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Search results will appear here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // NEW: Listen for the 'Enter' key inside the search box
        document.getElementById('searchInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        });

        function performSearch() {
            const query = document.getElementById('searchInput').value;
            
            // Prevent searching if the box is empty
            if (!query.trim()) return; 

            fetch(`/api/search?q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('table-body');
                    tableBody.innerHTML = ''; // Clear old results
                    
                    if(data.length === 0) {
                        // Updated colspan to 7 to account for the new Comments column
                        tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No records found.</td></tr>';
                        return;
                    }

                    data.forEach(record => {
                        let priorityClass = 'priority-normal';
                        if (record.priority === 'High') priorityClass = 'priority-high';
                        if (record.priority === 'Urgent') priorityClass = 'priority-urgent';

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><strong>#${record.id}</strong></td>
                            <td>${record.agency}</td>
                            <td>${record.file_no}</td>
                            <td>${record.subject}</td>
                            <td>${record.due_date || '-'}</td>
                            <td><span class="badge ${priorityClass}">${record.priority || 'Normal'}</span></td>
                            <td>${record.comments || '-'}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Error fetching data:', error));
        }
    </script>
</body>
</html>
