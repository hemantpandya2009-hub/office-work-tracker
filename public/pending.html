<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Work - Office Work Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f6f9; }
        .header { background-color: #1e293b; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;}
        .header h2 { margin: 0; }
        .container { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 220px; background-color: #334155; color: white; padding-top: 20px; }
        .sidebar a { display: block; color: #cbd5e1; text-decoration: none; padding: 15px 25px; border-left: 4px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background-color: #475569; color: white; border-left: 4px solid #3b82f6; }
        .main-content { padding: 30px; flex-grow: 1; overflow-y: auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #cbd5e1; }
        th { background-color: #f8fafc; color: #334155; font-weight: bold; }
        tr:hover { background-color: #f1f5f9; }
        .badge { padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .priority-high { background-color: #fef08a; color: #854d0e; }
        .priority-urgent { background-color: #fecaca; color: #991b1b; }
        .priority-normal { background-color: #d1fae5; color: #065f46; }
        
        .btn-edit { background-color: #f59e0b; color: white; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 14px; margin-right: 5px; cursor: pointer; border: none;}
        .btn-edit:hover { background-color: #d97706; }
        .btn-done { background-color: #10b981; color: white; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 14px; margin-right: 5px; cursor: pointer; border: none;}
        .btn-done:hover { background-color: #059669; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Office Work Tracker</h2>
        <span>Status: Online</span>
    </div>
    <div class="container">
        <div class="sidebar">
            <a href="/">Dashboard</a>
            <a href="/add-work.html">Add Work</a>
            <a href="/my-work.html">My Work</a>
            <a href="/pending.html" class="active">Pending</a>
            <a href="/reports.html">Reports</a>
            <a href="/search.html">Search</a>
            <a href="/manage-users.html">Manage Users</a>
        </div>
        <div class="main-content">
            <h1>Pending Tasks</h1>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Work ID</th>
                            <th>Agency</th>
                            <th>File No.</th>
                            <th>Subject</th>
                            <th>Due Date</th>
                            <th>Priority</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Records will appear here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/work')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('table-body');
                let hasPending = false;
                
                data.forEach(record => {
                    // Only show records that are not Completed
                    if (record.status !== 'Completed') {
                        hasPending = true;
                        let priorityClass = 'priority-normal';
                        if (record.priority === 'High') priorityClass = 'priority-high';
                        if (record.priority === 'Urgent') priorityClass = 'priority-urgent';

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><strong>#${record.id}</strong></td>
                            <td>${record.agency}</td>
                            <td>${record.file_no}</td>
                            <td>${record.subject}</td>
                            <td>${record.due_date || '-'}</td>
                            <td><span class="badge ${priorityClass}">${record.priority || 'Normal'}</span></td>
                            <td>
                                <button onclick="markCompleted(${record.id})" class="btn-done">✔ Done</button>
                                <a href="/edit-work.html?id=${record.id}" class="btn-edit">Edit</a>
                            </td>
                        `;
                        tableBody.appendChild(row);
                    }
                });

                if (!hasPending) {
                    tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No pending tasks! 🎉</td></tr>';
                }
            })
            .catch(error => console.error('Error fetching data:', error));

        function markCompleted(id) {
            if (confirm("Mark Work ID #" + id + " as Completed? It will be removed from this list.")) {
                fetch(`/api/work/${id}/complete`, { method: 'POST' })
                    .then(response => {
                        if (response.ok) location.reload();
                    })
                    .catch(error => console.error('Error:', error));
            }
        }
    </script>
</body>
</html>
