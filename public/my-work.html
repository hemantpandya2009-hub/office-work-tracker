<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work - Office Work Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f6f9; }
        .header { background-color: #1e293b; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;}
        .header h2 { margin: 0; }
        .container { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 220px; background-color: #334155; color: white; padding-top: 20px; }
        .sidebar a { display: block; color: #cbd5e1; text-decoration: none; padding: 15px 25px; border-left: 4px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background-color: #475569; color: white; border-left: 4px solid #3b82f6; }
        .main-content { padding: 30px; flex-grow: 1; overflow-y: auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #cbd5e1; }
        th { background-color: #f8fafc; color: #334155; font-weight: bold; }
        tr:hover { background-color: #f1f5f9; }
        .badge { padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .priority-high { background-color: #fef08a; color: #854d0e; }
        .priority-urgent { background-color: #fecaca; color: #991b1b; }
        .priority-normal { background-color: #d1fae5; color: #065f46; }
        .btn-delete { background-color: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-delete:hover { background-color: #dc2626; }
        .btn-edit { background-color: #f59e0b; color: white; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 14px; margin-right: 5px; }
        .btn-edit:hover { background-color: #d97706; }

        /* Modal Styles */
        dialog { width: 500px; padding: 25px; border: none; border-radius: 8px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        dialog::backdrop { background-color: rgba(15, 23, 42, 0.6); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #cbd5e1; padding-bottom: 15px; margin-bottom: 15px; }
        .modal-header h2 { margin: 0; color: #1e293b; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #64748b; }
        .close-btn:hover { color: #0f172a; }
        .detail-row { margin-bottom: 10px; font-size: 15px; color: #334155;}
        .timeline-box { max-height: 200px; overflow-y: auto; border: 1px solid #e2e8f0; padding: 15px; border-radius: 4px; background: #f8fafc; }
        .timeline-item { margin-bottom: 10px; font-size: 14px; border-bottom: 1px solid #cbd5e1; padding-bottom: 8px; }
        .timeline-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Office Work Tracker</h2>
        <span>Status: Online</span>
    </div>
    <div class="container">
        <div class="sidebar">
            <a href="/">Dashboard</a>
            <a href="/add-work.html">Add Work</a>
            <a href="/my-work.html" class="active">My Work</a>
            <a href="/pending.html">Pending</a>
            <a href="/reports.html">Reports</a>
            <a href="/search.html">Search</a>
            <a href="/manage-users.html">Manage Users</a>
            <a href="/logout" style="color: #ef4444; font-weight: bold; margin-top: 20px; border-top: 1px solid #cbd5e1; padding-top: 15px; display: block; text-decoration: none;">🚪 Logout</a>
        </div>
        <div class="main-content">
            <h1>My Work Records</h1>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Work ID</th>
                            <th>Agency</th>
                            <th>File No.</th>
                            <th>Subject</th>
                            <th>Due Date</th>
                            <th>Priority</th>
                            <th>Comments</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Data will be injected here automatically by Javascript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- NEW: Task Details Modal -->
    <dialog id="taskModal">
        <div class="modal-header">
            <h2 id="modal-title">Task Details</h2>
            <button class="close-btn" onclick="document.getElementById('taskModal').close()">&times;</button>
        </div>
        <div id="modal-details">
            <!-- Details will populate here -->
        </div>
        <h3 style="margin-top: 20px; color: #334155; font-size: 16px;">Full Task History</h3>
        <div id="modal-timeline" class="timeline-box">
            <!-- Timeline will populate here -->
        </div>
    </dialog>

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const filterAgency = urlParams.get('agency');

    fetch('/api/work')
        .then(response => response.json())
        .then(data => {
            const tableBody = document.getElementById('table-body');
            
            data.forEach(record => {
                if (!filterAgency || filterAgency === 'All' || record.agency === filterAgency) {
                    let priorityClass = 'priority-normal';
                    if (record.priority === 'High') priorityClass = 'priority-high';
                    if (record.priority === 'Urgent') priorityClass = 'priority-urgent';

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <!-- UPDATED: Work ID is now a clickable link -->
                        <td><a href="#" onclick="openTaskModal(${record.id}); return false;" style="color: #3b82f6; text-decoration: none;"><strong>#${record.id}</strong></a></td>
                        <td>${record.agency}</td>
                        <td>${record.file_no}</td>
                        <td>${record.subject}</td>
                        <td>${record.due_date || '-'}</td>
                        <td><span class="badge ${priorityClass}">${record.priority || 'Normal'}</span></td>
                        <td>${record.comments || '-'}</td>
                        <td>
                            <a href="/edit-work.html?id=${record.id}" class="btn-edit">Edit</a>
                            <button onclick="deleteRecord(${record.id})" class="btn-delete">Delete</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                }
            });
        })
        .catch(error => console.error('Error fetching data:', error));

    function deleteRecord(id) {
        if (confirm("Are you sure you want to permanently delete Work ID #" + id + "?")) {
            fetch(`/api/work/${id}`, { method: 'DELETE' })
                .then(response => {
                    if (response.ok) {
                        location.reload(); 
                    }
                })
                .catch(error => console.error('Error:', error));
        }
    }

    // NEW: Function to open and populate the modal
    function openTaskModal(id) {
        const modal = document.getElementById('taskModal');
        
        // Fetch Main Details
        fetch(`/api/work/${id}`)
            .then(res => res.json())
            .then(record => {
                document.getElementById('modal-title').innerText = `Work ID #${record.id}`;
                
                let attachmentLink = 'None';
                if (record.attachment) attachmentLink = `<a href="/uploads/${record.attachment}" target="_blank" style="color: #3b82f6; font-weight: bold;">View File</a>`;

                document.getElementById('modal-details').innerHTML = `
                    <div class="detail-row"><strong>Agency:</strong> ${record.agency}</div>
                    <div class="detail-row"><strong>File No:</strong> ${record.file_no}</div>
                    <div class="detail-row"><strong>Subject:</strong> ${record.subject}</div>
                    <div class="detail-row"><strong>Due Date:</strong> ${record.due_date || '-'}</div>
                    <div class="detail-row"><strong>Priority:</strong> ${record.priority}</div>
                    <div class="detail-row"><strong>Status:</strong> ${record.status || 'Pending'}</div>
                    <div class="detail-row"><strong>Attachment:</strong> ${attachmentLink}</div>
                    <div class="detail-row" style="margin-top: 15px; padding-top: 10px; border-top: 1px dashed #cbd5e1;">
                        <strong>Comments:</strong><br>${record.comments || 'No comments.'}
                    </div>
                `;
            });

        // Fetch Timeline Updates
        fetch(`/api/work/${id}/updates`)
            .then(res => res.json())
            .then(updates => {
                const timeline = document.getElementById('modal-timeline');
                timeline.innerHTML = '';
                if (updates.length === 0) {
                    timeline.innerHTML = '<p style="color: #64748b; margin: 0;">No updates recorded yet.</p>';
                } else {
                    updates.forEach(update => {
                        timeline.innerHTML += `
                            <div class="timeline-item">
                                <span style="color: #3b82f6; font-weight: bold; margin-right: 5px;">${update.update_date}</span>
                                <span>${update.update_text}</span>
                            </div>
                        `;
                    });
                }
            });

        modal.showModal();
    }
    </script>
</body>
</html>
