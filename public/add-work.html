<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Work - Office Work Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f6f9; }
        .header { background-color: #1e293b; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;}
        .header h2 { margin: 0; }
        .container { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 220px; background-color: #334155; color: white; padding-top: 20px; }
        .sidebar a { display: block; color: #cbd5e1; text-decoration: none; padding: 15px 25px; border-left: 4px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background-color: #475569; color: white; border-left: 4px solid #3b82f6; }
        .main-content { padding: 30px; flex-grow: 1; overflow-y: auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 600px;}
        
        /* Form Styles */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #334155; font-weight: bold; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        .btn-submit { background-color: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; width: 100%;}
        .btn-submit:hover { background-color: #2563eb; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Office Work Tracker</h2>
        <span>Status: Online</span>
    </div>
       <div class="container">
        <div class="sidebar">
        <a href="/">Dashboard</a>
        <a href="/add-work.html" class="active">Add Work</a>
        <a href="/my-work.html">My Work</a>
        <a href="/pending.html">Pending</a>
        <a href="/reports.html">Reports</a>
        <a href="/search.html">Search</a>
        <a href="/manage-users.html">Manage Users</a>
        <a href="/logout" style="color: #ef4444; font-weight: bold; margin-top: 20px; border-top: 1px solid #cbd5e1; padding-top: 15px; display: block; text-decoration: none;">🚪 Logout</a>
      </div>
        <div class="main-content">
            <h1>Add New Work Record</h1>
            <div class="card">
                <form action="/add-work" method="POST" enctype="multipart/form-data">
    <div class="form-group">
        <label>Agency</label>
        <select class="form-control" name="agency" required>
            <option value="">Select the Agency...</option>
            <option value="KDA">KDA</option>
            <option value="Bhilwara">Bhilwara</option>
            <option value="Chittorgarh">Chittorgarh</option>
            <option value="Sawai Madhopur">Sawai Madhopur</option>
        </select>
    </div>
    <div class="form-group">
        <label>RajKaj / File No.</label>
        <input type="text" class="form-control" name="file_no" placeholder="Enter file number" required>
    </div>
    <div class="form-group">
        <label>Subject</label>
        <input type="text" class="form-control" name="subject" placeholder="What is this regarding?" required>
    </div>
    <div class="form-group">
        <label>Due Date</label>
        <input type="date" class="form-control" name="due_date">
    </div>
    <div class="form-group">
        <label>Priority</label>
        <select class="form-control" name="priority">
            <option value="Normal">Normal</option>
            <option value="High">High</option>
            <option value="Urgent">Urgent</option>
        </select>
    </div>
    <div class="form-group">
        <label>Comments / Remarks</label>
        <textarea class="form-control" name="comments" rows="3" placeholder="Add any additional notes here..."></textarea>
    </div>
    <div class="form-group">
        <label>Optional Attachment (PDF, Image, etc.)</label>
        <input type="file" class="form-control" name="attachment" style="padding-bottom: 35px;">
    </div>
    <button type="submit" class="btn-submit">Save Work Record</button>
</form>
            </div>
        </div>
    </div>
   <script>
  document.addEventListener('DOMContentLoaded', () => {
    const agencySelect = document.querySelector('select[name="agency"]');
    const form = document.querySelector('form');
    if (!agencySelect || !form) return;

    // Create a warning message banner dynamically
    const warningBanner = document.createElement('div');
    warningBanner.style.color = '#dc2626';
    warningBanner.style.backgroundColor = '#fee2e2';
    warningBanner.style.padding = '10px';
    warningBanner.style.borderRadius = '4px';
    warningBanner.style.marginTop = '15px';
    warningBanner.style.fontWeight = 'bold';
    warningBanner.style.textAlign = 'center';
    warningBanner.style.display = 'none';
    warningBanner.innerText = '⚠️ UNAUTHORIZED AGENCY: All input fields are locked for this selection.';
    form.appendChild(warningBanner);

    // Check permissions whenever the agency selection changes
    agencySelect.addEventListener('change', function() {
      const selectedAgency = this.value;
      
      // Fetch current user session details from backend
      fetch('/api/user-session')
        .then(res => res.json())
        .then(data => {
          // If user is not admin and agency is not in their allowed list, lock all fields
          if (data.role !== 'admin' && !data.agencies.includes(selectedAgency)) {
            lockAllFields(true);
          } else {
            lockAllFields(false);
          }
        })
        .catch(err => console.error("Error checking permissions:", err));
    });

    function lockAllFields(lock) {
      // Select all inputs, textareas, selects (except the agency dropdown itself), and submit button
      const elements = form.querySelectorAll('input, textarea, select:not([name="agency"]), button[type="submit"]');
      elements.forEach(el => {
        el.disabled = lock;
        if (lock) {
          el.style.backgroundColor = '#f1f5f9';
          el.style.cursor = 'not-allowed';
        } else {
          el.style.backgroundColor = '';
          el.style.cursor = '';
        }
      });
      warningBanner.style.display = lock ? 'block' : 'none';
    }
  });
</script>
</body>
</html>
