<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Office Work Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f6f9; }
        .header { background-color: #1e293b; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;}
        .container { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 220px; background-color: #334155; color: white; padding-top: 20px; }
        .sidebar a { display: block; color: #cbd5e1; text-decoration: none; padding: 15px 25px; border-left: 4px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background-color: #475569; color: white; border-left: 4px solid #3b82f6; }
        .main-content { padding: 30px; flex-grow: 1; overflow-y: auto; }
        
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #334155; font-weight: bold; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background-color: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold;}
        .btn-submit:hover { background-color: #059669; }
        
        .btn-delete { background-color: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;}
        .btn-delete:hover { background-color: #dc2626; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #cbd5e1; }
        th { background-color: #f8fafc; color: #334155; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; background: #e2e8f0; margin-right: 4px;}
        .badge-admin { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Office Work Tracker - Admin</h2>
        <a href="/logout" style="color: white; font-weight: bold; text-decoration: none;">Logout</a>
    </div>
    <div class="container">
        <div class="sidebar">
            <a href="/">Dashboard</a>
            <a href="/add-work.html">Add Work</a>
            <a href="/my-work.html">My Work</a>
            <a href="/pending.html">Pending</a>
            <a href="/manage-users.html" class="active">Manage Users</a>
        </div>
        <div class="main-content">
            <h1>System Users & Permissions</h1>
            
            <div class="card" style="max-width: 600px;">
                <h3>Add New User</h3>
                <form id="addUserForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="new_username" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="new_password" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Access Level</label>
                        <select id="new_role" class="form-control">
                            <option value="employee">Standard Employee (Can Add & Edit)</option>
                            <option value="viewer">Viewer (Read-Only Access)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Allowed Agencies (Check all that apply)</label>
                        <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px;">
                            <label><input type="checkbox" class="agency-cb" value="KDA"> KDA</label>
                            <label><input type="checkbox" class="agency-cb" value="Bhilwara"> Bhilwara</label>
                            <label><input type="checkbox" class="agency-cb" value="Chittorgarh"> Chittorgarh</label>
                            <label><input type="checkbox" class="agency-cb" value="Sawai Madhopur"> Sawai Madhopur</label>
                        </div>
                    </div>
                    <button type="button" onclick="createUser()" class="btn-submit">Create User Account</button>
                </form>
            </div>

            <div class="card">
                <h3>Current Users</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Assigned Agencies</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="users-table">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function loadUsers() {
            fetch('/api/users')
                .then(res => {
                    if (res.status === 403) { alert("Unauthorized."); window.location.href = '/'; throw new Error("Unauthorized"); }
                    return res.json();
                })
                .then(data => {
                    const tbody = document.getElementById('users-table');
                    tbody.innerHTML = '';
                    data.forEach(user => {
                        let roleBadge = '';
                        if (user.role === 'admin') roleBadge = '<span class="badge badge-admin">Master Admin</span>';
                        else if (user.role === 'viewer') roleBadge = '<span class="badge" style="background:#fef08a; color:#854d0e;">Viewer (Read-Only)</span>';
                        else roleBadge = '<span class="badge" style="background:#d1fae5; color:#065f46;">Employee (Edit)</span>';
                        
                        let agenciesHtml = '';
                        if (user.agencies === 'ALL') { agenciesHtml = '<em>Full Access</em>'; }
                        else { user.agencies.split(',').forEach(a => agenciesHtml += `<span class="badge">${a}</span>`); }

                        let deleteBtnHtml = '';
                        // Do not show the remove button if the user is an admin
                        if (user.role !== 'admin') {
                            deleteBtnHtml = `<button class="btn-delete" onclick="deleteUser(${user.id}, '${user.username}')">Remove</button>`;
                        }

                        tbody.innerHTML += `<tr><td><strong>${user.username}</strong></td><td>${roleBadge}</td><td>${agenciesHtml}</td><td>${deleteBtnHtml}</td></tr>`;
                    });
                });
        }

        function createUser() {
            const username = document.getElementById('new_username').value.trim();
            const password = document.getElementById('new_password').value.trim();
            const role = document.getElementById('new_role').value;
            
            const checkboxes = document.querySelectorAll('.agency-cb:checked');
            const agencies = Array.from(checkboxes).map(cb => cb.value);

            if (!username || !password || agencies.length === 0) { alert("Fill all fields and select at least one agency."); return; }

            fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, role, agencies })
            }).then(res => res.text()).then(text => {
                if (text === 'Success') { document.getElementById('addUserForm').reset(); loadUsers(); } 
                else { alert("Error: " + text); }
            });
        }

        function deleteUser(userId, username) {
            if (confirm(`Revoke access for ${username}?`)) {
                fetch(`/api/users/${userId}`, { method: 'DELETE' }).then(res => res.text()).then(text => {
                    if (text === 'Success') loadUsers(); else alert("Error: " + text);
                });
            }
        }

        loadUsers();
    </script>
</body>
</html>
