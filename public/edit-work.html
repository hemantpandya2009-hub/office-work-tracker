<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Work - Office Work Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f6f9; }
        .header { background-color: #1e293b; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;}
        .header h2 { margin: 0; }
        .container { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 220px; background-color: #334155; color: white; padding-top: 20px; }
        .sidebar a { display: block; color: #cbd5e1; text-decoration: none; padding: 15px 25px; border-left: 4px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background-color: #475569; color: white; border-left: 4px solid #3b82f6; }
        .main-content { padding: 30px; flex-grow: 1; overflow-y: auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 600px; margin-bottom: 20px;}
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #334155; font-weight: bold; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        .btn-submit { background-color: #10b981; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; width: 100%;}
        .btn-submit:hover { background-color: #059669; }
        
        /* Timeline styles */
        .timeline-box { max-height: 200px; overflow-y: auto; border: 1px solid #e2e8f0; padding: 15px; border-radius: 4px; background: #f8fafc; margin-bottom: 15px; }
        .timeline-item { margin-bottom: 10px; font-size: 14px; border-bottom: 1px solid #cbd5e1; padding-bottom: 8px; }
        .timeline-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .timeline-date { color: #3b82f6; font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Office Work Tracker</h2>
        <span>Status: Online</span>
    </div>
    <div class="container">
        <div class="sidebar">
            <a href="/">Dashboard</a>
            <a href="/add-work.html">Add Work</a>
            <a href="/my-work.html" class="active">My Work</a>
            <a href="/pending.html">Pending</a>
            <a href="/reports.html">Reports</a>
            <a href="/search.html">Search</a>
            <a href="/manage-users.html">Manage Users</a>
        </div>
        <div class="main-content">
            <h1>Edit Work Record</h1>
            
            <!-- Main Edit Form -->
            <div class="card">
                <!-- UPDATED: Added enctype for file uploads -->
                <form id="editForm" method="POST" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>Agency</label>
                        <select class="form-control" name="agency" id="agency" required>
                            <option value="">Select the Agency...</option>
                            <option value="KDA">KDA</option>
                            <option value="Bhilwara">Bhilwara</option>
                            <option value="Chittorgarh">Chittorgarh</option>
                            <option value="Sawai Madhopur">Sawai Madhopur</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>RajKaj / File No.</label>
                        <input type="text" class="form-control" name="file_no" id="file_no" required>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" class="form-control" name="subject" id="subject" required>
                    </div>
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date" class="form-control" name="due_date" id="due_date">
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select class="form-control" name="priority" id="priority">
                            <option value="Normal">Normal</option>
                            <option value="High">High</option>
                            <option value="Urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Comments / Remarks</label>
                        <textarea class="form-control" name="comments" id="comments" rows="3"></textarea>
                    </div>
                    
                    <!-- NEW: File Attachment Section -->
                    <div class="form-group">
                        <label>Attachment (PDF, Image, etc.)</label>
                        <div id="current-attachment" style="margin-bottom: 10px; font-size: 14px; color: #475569;">
                            <!-- Existing attachment link will appear here -->
                        </div>
                        <input type="file" class="form-control" name="attachment" style="padding-bottom: 35px;">
                        <small style="color: #64748b;">Leave this blank to keep the current file.</small>
                    </div>

                    <button type="submit" class="btn-submit">Update Work Record</button>
                </form>
            </div>

            <!-- NEW: Date-Wise Task History Timeline -->
            <div class="card">
                <h3 style="margin-top: 0; color: #334155;">Task History & Updates</h3>
                
                <div class="timeline-box" id="timeline-container">
                    <!-- Date-wise updates will load here -->
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="new-update-text" class="form-control" placeholder="Add a new update (e.g., Forwarded to Secretary)">
                    <button type="button" onclick="addUpdate()" class="btn-submit" style="margin-top: 0; width: 100px;">Add</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const recordId = urlParams.get('id');

        if (!recordId) {
            alert("No record selected to edit!");
            window.location.href = "/my-work.html";
        } else {
            // Setup form submission URL
            document.getElementById('editForm').action = `/edit-work/${recordId}`;

            // 1. Fetch Main Record Data
            fetch(`/api/work/${recordId}`)
                .then(response => response.json())
                .then(record => {
                    document.getElementById('agency').value = record.agency;
                    document.getElementById('file_no').value = record.file_no;
                    document.getElementById('subject').value = record.subject;
                    document.getElementById('due_date').value = record.due_date;
                    document.getElementById('priority').value = record.priority;
                    document.getElementById('comments').value = record.comments;

                    // Display existing attachment if one exists
                    if (record.attachment) {
                        document.getElementById('current-attachment').innerHTML = 
                            `<strong>Current File:</strong> <a href="/uploads/${record.attachment}" target="_blank" style="color: #3b82f6;">View File</a>`;
                    } else {
                        document.getElementById('current-attachment').innerHTML = `<em>No file currently attached.</em>`;
                    }
                })
                .catch(error => console.error('Error fetching record details:', error));

            // 2. Fetch and Load Task History
            function loadHistory() {
                fetch(`/api/work/${recordId}/updates`)
                    .then(response => response.json())
                    .then(updates => {
                        const container = document.getElementById('timeline-container');
                        container.innerHTML = ''; 

                        if (updates.length === 0) {
                            container.innerHTML = '<p style="color: #64748b; margin: 0;">No updates recorded yet.</p>';
                            return;
                        }

                        updates.forEach(update => {
                            container.innerHTML += `
                                <div class="timeline-item">
                                    <span class="timeline-date">${update.update_date}</span>
                                    <span>${update.update_text}</span>
                                </div>
                            `;
                        });
                    })
                    .catch(error => console.error('Error fetching history:', error));
            }

            // Load history immediately
            loadHistory();

            // 3. Add a New Task Update
            window.addUpdate = function() {
                const textInput = document.getElementById('new-update-text');
                const text = textInput.value.trim();
                
                if (!text) return; // Don't add empty updates

                fetch(`/api/work/${recordId}/updates`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ update_text: text })
                })
                .then(response => {
                    if (response.ok) {
                        textInput.value = ''; // Clear the input box
                        loadHistory(); // Reload the timeline instantly
                    } else {
                        alert("Error saving update.");
                    }
                })
                .catch(error => console.error('Error saving update:', error));
            }
        }
    </script>
</body>
</html>
